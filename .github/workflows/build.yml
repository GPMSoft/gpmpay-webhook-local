# Native AOT không biên dịch chéo hệ điều hành → mỗi OS build trên runner của chính nó.
# Chạy tay (Actions → Build → Run workflow) hoặc tự chạy khi đẩy tag v*.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            run: ./scripts/build-windows.ps1 -Arch x64
            shell: pwsh
            artifact: artifacts/GpmPayWebhookLocal-win-x64.zip
          - name: macos-universal
            os: macos-latest
            run: ./scripts/build-macos.sh universal
            shell: bash
            artifact: artifacts/GpmPayWebhookLocal-macos-universal.zip

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # `shell:` của từng step không nhận biểu thức ${{ }} → đặt shell theo matrix ở cấp job
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Cấp quyền chạy script
        if: runner.os != 'Windows'
        run: chmod +x scripts/*.sh

      - name: Build Native AOT
        run: ${{ matrix.run }}

      # archive: false → tải lên nguyên file .zip / .tar.gz (không bị nén thêm 1 lớp zip nữa);
      # tên artifact = tên file
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.artifact }}
          archive: false

  # Linux: bản AOT cần glibc >= bản của máy build. Build trong container Ubuntu 22.04 (glibc 2.35)
  # → chạy được trên Ubuntu 22.04+, Debian 12+, Fedora 36+… dù runner GitHub là Ubuntu mới hơn.
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm

    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    container: ubuntu:22.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Cài công cụ build (clang, zlib, ICU cho .NET SDK)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git clang binutils zlib1g-dev libicu70

      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build Native AOT
        run: |
          chmod +x scripts/*.sh
          ./scripts/build-linux.sh ${{ matrix.arch }}

      - name: Kiểm tra glibc tối đa mà file chạy cần
        run: objdump -T artifacts/linux-${{ matrix.arch }}/GpmPayWebhookLocal | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1

      - uses: actions/upload-artifact@v7
        with:
          path: artifacts/GpmPayWebhookLocal-linux-${{ matrix.arch }}.tar.gz
          archive: false
